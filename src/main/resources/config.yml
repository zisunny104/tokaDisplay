# 語系（顯示文字的語言）。目前提供 zh-TW（繁體中文）；伺服器擁有者可在 lang 資料夾放同名檔覆蓋個別文字。
language: zh-TW

# 畫面更新間隔（tick）。
update-ticks: 5
# 每位玩家、每種顯示管道的來源上限，避免來源未清理而持續累積。
max-sources: 32

# 公告（MOTD 與廣播）資料的儲存方式：sqlite、json 或 yaml，由共用的 tokaStorage 提供。
storage:
  backend: sqlite
# 公告發布開關。若舊的 MOTD／廣播仍運行，會暫停發布避免重複。
announcements:
  enabled: true
  # MOTD 輪播的間隔（秒）。
  motd-seconds: 10
  # 廣播的間隔（秒）。
  broadcast-seconds: 25

# 頂部血條區與側邊記分板的顯示。關掉後對應的畫面都不會出現。
bossbar:
  enabled: true
sidebar:
  enabled: true
  # 側欄標題，可用 § 色碼。
  title: "§e                              §r"
  # 組合並更新側欄的間隔（tick）。
  refresh-ticks: 20
  # 手上物品那一行的最大寬度（中文約算 2、英文約算 1）。物品名稱太長、超過時，名稱會改放在下一行（接在物品那行後面的空白行位置），不會多出一行；名稱還是太長就以 … 省略。
  item-max-width: 24
  # 側欄由上而下的內容：項目是區段 id，或 - 代表一行空白。內建區段：position、bearing、item、tps、ping；
  # region、money、coin、area 由其他插件註冊。沒有註冊或這一輪沒內容的區段會略過，多餘的空白行自動收斂，最多 15 行。
  layout:
    - region
    - position
    - bearing
    - "-"
    - money
    - coin
    - "-"
    - item
    - "-"
    - tps
    - ping
    - area

# 血條的預設顏色。遊戲只有 7 種血條顏色：pink、blue、red、green、yellow、purple、white。
default-color: white

# 顏色別名：左邊是別名，右邊是上面 7 種顏色之一。其他插件送訊息時可以直接用別名，
# 之後想換顏色，只要改這裡，不用改插件。沒填顏色時使用上面的預設顏色。
colors:
  cooldown: red
  ready: green
  notice: yellow

# 訊息區（血條下面的文字）。第一行是基本資訊，只有它的擁有者能改；
# 接著是固定訊息，最後是只發送一次、閃過就消失的訊息。
messages:
  # 只發送一次的訊息，發送時沒有指定秒數就用這個秒數。
  flash-seconds: 15
  # 同時最多顯示幾則只發送一次的訊息，超過時最舊的先消失。
  max-flash-lines: 4
  # 每位玩家同時最多幾則固定訊息。
  max-pinned: 8
  # 每則「只發送一次」的訊息開頭（第一行前面），可以用 § 色碼；留空就不加。
  flash-prefix: "§8- §r"
  # 每則「固定」訊息的開頭，可以用 § 色碼；留空就不加。
  pinned-prefix: "§8= §r"
  # true：清掉沒有內容可讀的空白行與行尾空白，血條下面就不會留空位；false：照原樣顯示。
  trim-blank-lines: true
  # 血條畫在第一行的下面，所以當第一行下面還有別的內容時，要先空幾行，內容才不會被血條蓋住（預設 1）；沒有別的內容就不空。
  bar-gap-lines: 1
  # 文字區最少有多寬（用「一個空白的寬度」算，中文約算 2、英文約算 1）。第一行（狀態列）會用空白補到這個寬度的正中間，其他行維持靠左。
  status-min-width: 60
  # 訊息裡超過這個寬度的行會自動換行（寬度算法同上，中文約 2、英文約 1），不必在訊息裡自己換行；0 代表不自動換行。
  wrap-width: 60
  # 沒有指定秒數的固定訊息最久留多久（秒），預設 0 代表不限制。擔心有人忘記關掉固定訊息時，可以設成例如 21600（6 小時）。
  # 管理員也可以用 /display list 查看、/display unpin 移除、/display clear 清除。
  pinned-max-seconds: 0

# 玩家名稱標籤（聊天、加入離開訊息使用）。${name} 是玩家名稱，${mode} 是遊戲模式顏色，
# 其他 ${id} 是其他插件登錄的片段（例如 title、affiliation、prefix）；沒有插件提供就是空白。
# 頂部的基本資訊（線上人數、時間、名牌）。format 可用 ${online}、${time}、${light}、${nametag}。
# 時間用 24 小時制、補零，數字畫成圈圈數字；time-format 是 java.time 的樣式。
baseline:
  enabled: true
  refresh-ticks: 20
  fill: 100
  time-format: "HH:mm"
  format: " §5[線上]${online}  §9${time}§r  ${light}${nametag}§r \n                                                            \n"

# 玩家在線上時的燈（在不在由 tokaAnchor 判斷，沒有它就一律當作在）。
light:
  here: "§a⧯§r"
  away: "§c⧯§r"

nametag:
  format: "${prefix}§r${affiliation}§r${mode}[${title}${mode}${name}${mode}]"
  mode-colors:
    survival: "§a"
    creative: "§b"
    adventure: "§6"
    spectator: "§e"
  # 離線的人，或不在上面列表的模式使用。
  fallback-mode-color: "§7"
