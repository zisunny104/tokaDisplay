name: tokaDisplay
main: dev.toka.display.Main
version: "0.2.2"
api: ["1.0.4"]
author: zisunny104
load: POSTWORLD
description: 共用 BossBar 與側邊記分板顯示服務
commands:
  display:
    description: 查詢顯示服務狀態
    permission: tokaDisplay.use
permissions:
  tokaDisplay.admin:
    default: op


  tokaDisplay.use:
    default: true
  tokaDisplay.motd.manage:
    default: op
  tokaDisplay.broadcast.manage:
    default: op
  tokaDisplay.announcements.manage:
    default: op

