# tokaDisplay 繁體中文語系檔（zh-TW）
# 規則：${0}、${1} 是依序傳入的參數，每個參數只替換一次；§ 是顏色碼。
# 顏色慣例：一般文字 §b、數字／名稱 §a、警告 §e、成功 §a、錯誤 §c、次要說明 §7、標題 §6。
# 後台 log 不加方括號標籤。指令名稱、權限節點、config key 不翻譯。
# 伺服器擁有者可在 plugins/tokaDisplay/lang/zh-TW.yml 覆蓋個別文字，沒寫到的 key 仍用本檔。

# ---- 指令說明與用法（cmd.*） ----
# 用法列在錯誤提示與 /display 預設回應中使用，沒有參數。
cmd:
  display:
    usage: "§7/display reload | list [玩家] | unpin <玩家或*> <訊息id或編號> | clear <玩家或*> | testbar [顏色] [填充度] | motd|broadcast ... | help"
    unpin:
      usage: "§7用法：/display unpin <玩家或*> <訊息id或編號>"
    clear:
      usage: "§7用法：/display clear <玩家或*>"
    announce:
      usage: "§7/display motd|broadcast list|add <文字>|set <ID> <文字>|remove <ID>"

# ---- /display help 的多行說明（help.*）：第一行會被分頁標題取代 ----
help:
  # ${0} = 頁、${1} = 總頁數
  head: "§6=== §f§ltokaDisplay 說明§r §6第 §a${0}§6/§a${1}§6 頁，/display help <頁> ==="
  display:
    - "§6=== §f§ltokaDisplay 說明§r §6==="
    - "§e/display §7- §b管理員在遊戲內開公告視窗，後台顯示狀態與用法"
    - "§e/display reload §7- §b重讀設定與語言（需要 tokaDisplay.admin）"
    - "§e/display help §7- §b顯示這份說明"
    - "§e/display list [玩家] §7- §b列出固定與單次訊息（不指定玩家就列出全部）"
    - "§e/display unpin <玩家或*> <訊息id或編號> §7- §b移除指定訊息，* 代表所有玩家"
    - "§e/display clear <玩家或*> §7- §b清除固定與單次訊息"
    - "§e/display testbar [顏色] [填充度] §7- §b在自己的血條顯示 10 秒測試，顏色可省略（填充度 0 到 100）"
    - "§e/display motd list §7- §b列出所有 MOTD"
    - "§e/display motd add <文字> §7- §b新增 MOTD"
    - "§e/display motd set <ID> <文字> §7- §b修改指定 MOTD"
    - "§e/display motd remove <ID> §7- §b刪除指定 MOTD"
    - "§e/display broadcast list|add|set|remove ... §7- §b廣播的用法與 motd 相同"
    - "§7motd 是伺服器清單上的標題，輪流更換；broadcast 是頂部訊息區的單次訊息，輪流顯示"
    - "§7權限：§atokaDisplay.admin §7管理訊息與 reload；§atokaDisplay.motd.manage §7與 §atokaDisplay.broadcast.manage §7管理公告；§atokaDisplay.use §7查看狀態"

# ---- 玩家與管理員看到的訊息（msg.*） ----
msg:
  display:
    # ${0} = 目前顯示中的玩家數量
    status: "§btokaDisplay：就緒；顯示中的玩家 §a${0}"
    list:
      # ${0} = 玩家名稱、${1} = 編號、${2} = 種類（status.pinned／status.once）、${3} = 訊息 id、
      # ${4} = 優先權、${5} = 剩餘時間（status.forever／status.remaining）、${6} = 訊息內容（最多 30 字）
      row: "§a${0} §7#§a${1} §b${2} id=§a${3} §b優先權=§a${4} ${5} §7${6}"
      # ${0} = 訊息總數
      total: "§b共 §a${0} §b則訊息（不含基本資訊）"
    # ${0} = 被移除訊息的玩家數量、${1} = 使用者輸入的訊息 id 或編號
    unpinned: "§a已從 ${0} 位玩家移除訊息 ${1}"
    # ${0} = 被清除的玩家數量
    cleared: "§a已清除 ${0} 位玩家的固定與單次訊息"
    reloaded: "§a已重新載入設定與語言"
    testbar:
      # 顯示在血條上的文字。${0} = 顏色（未指定時為 status.defaultColor）、${1} = 填充度（整數）
      text: "§e血條測試：${0} ${1}%"
      # 回覆給指令使用者；無參數
      started: "§a已顯示測試血條 10 秒"
  announce:
    # ${0} = motd 或 broadcast、${1} = 該筆的 ID、${2} = 內容（換行以空白顯示）
    added: "§a已新增 ${0} #${1}：§r${2}"
    changed: "§a已修改 ${0} #${1}：§r${2}"
    removed: "§a已移除 ${0} #${1}：§r${2}"
    # ${0} = 例外類別名稱
    failed: "§c操作未完成（${0}）"

# ---- 側邊記分板內建區段與公告視窗（ui.*） ----
ui:
  close: "§c關閉"
  back: "返回"
  search: "搜尋"
  searchLabel: "關鍵字或編號"
  searchHint: "留空顯示全部"
  add: "新增"
  prev: "上一頁"
  next: "下一頁"
  # ${0} = 編號、${1} = 內容摘要
  entry: "#${0} ${1}"
  kind:
    motd: "MOTD"
    broadcast: "廣播"
  menu:
    title: "公告管理"
    motd: "MOTD（${0}）"
    broadcast: "廣播（${0}）"
  list:
    # ${0} = 種類、${1} = 頁、${2} = 總頁數
    title: "${0} ${1}/${2}"
    # ${0} = 符合數、${1} = 總數
    body: "共 §a${0}§r 則"
    # ${2} = 搜尋字
    bodyQuery: "符合 §a${0}§r／§a${1}§r 則，搜尋「${2}」"
  textLabel: "內容"
  textHint: "換行請輸入 \\n"
  edit:
    title: "${0} #${1}"
    delete: "刪除這則"
  delete:
    title: "確認刪除"
    body: "要刪除 ${0} #${1} 嗎？"
    "yes": "刪除"
    "no": "§c取消"
  sidebar:
    # ${0} = X、${1} = Y、${2} = Z
    position: "§3[座標]${0}:${1}:${2}§r"
    # ${0} = 方位名稱（directions）
    bearing: "§3[方位]${0}§r"
    # 依序為南、西南、西、西北、北、東北、東、東南
    directions:
      - "南方"
      - "西南"
      - "西方"
      - "西北"
      - "北方"
      - "東北"
      - "東方"
      - "東南"
    # ${0} = 物品 ID、${1} = 損傷值
    item: "§a[物品]${0}:${1} §7${2}§r"
    # 物品名稱太長時，物品 ID 與損傷值放在這一行（${0} = 物品 ID、${1} = 損傷值），
    itemHead: "§a[物品]${0}:${1}§r"
    # 名稱改放在下一行（${0} = 物品名稱，太長時尾端以 … 省略）。
    itemName: "§7${0}§r"
    # ${0} = 狀態色碼、${1} = TPS
    tps: "${0}⧯${1}§r"
    # ${0} = 狀態色碼、${1} = Ping（毫秒）
    ping: "${0}⧯${1}§r"

# ---- 錯誤與拒絕（err.*） ----
err:
  # ${0} = 玩家名稱（使用者輸入）
  playerNotFound: "§c找不到玩家 ${0}（需完整名稱且在線）"
  playerOnly: "§c只能在遊戲內使用"
  fillRange: "§c填充度要是 0 到 100 的數字"
  noManagePermission: "§c沒有此項管理權限"
  # ${0} = 例外類別名稱，後面另外顯示 cmd.display.announce.usage
  announceFailed: "§c操作未完成（${0}）："
  emptyText: "§c內容不能留空"
  # ${0} = 廣播的字數（含色碼），${1} = 位元組數，${2} = 字數上限，${3} = 位元組上限
  broadcastTooLong: "§c廣播太長（${0} 字／${1} 位元組，上限 ${2} 字／${3} 位元組），請縮短"

# ---- 後台文字（log.*）：不加方括號標籤 ----
log:
  # ${0} = MOTD 數量
  motdLoaded: "§b載入 MOTD 共 §a${0} §b個"
  # ${0} = 廣播數量
  broadcastLoaded: "§b載入廣播共 §a${0} §b個"
  badDefaultColor: "§edefault-color 不是可用的顏色，改用白色"
  # ${0} = 不認得的顏色名稱、${1} = 可用的顏色與別名（以逗號分隔）
  badBarColor: "§e不認得的血條顏色「${0}」，改用預設顏色；可用：${1}"
  # ${0} = 例外類別名稱
  announceFailed: "§e公告發布失敗：${0}"
  # ${0} = 例外類別名稱
  playerPaused: "§e玩家顯示暫停：${0}"
  # ${0} = 例外類別名稱
  announceSaveFailed: "§e公告儲存失敗：${0}"
  storageDrainTimeout: "§e公告儲存逾時，仍有未完成的寫入"
  # ${0} = 區段 id
  sectionFailed: "§e側欄區段 ${0} 發生例外，本輪略過"
  # ${0} = 名稱標籤片段 id
  tagPartFailed: "§e名稱標籤片段 ${0} 發生例外，已略過"
  sidebarTooLong: "§e側欄超過 15 行，多的行已略過"
  storageCloseFailed: "§e公告儲存關閉失敗"
  storageOpenFailed: "§c無法開啟公告儲存，已保留原資料"

# ---- 狀態字（status.*） ----
status:
  defaultColor: "預設顏色"
  pinned: "固定"
  once: "單次"
  forever: "§b永久"
  # ${0} = 剩餘秒數
  remaining: "§b剩 §a${0} §b秒"
